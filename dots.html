<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#fff7fa"
    >

    <title>USSPACE • Dots & Boxes</title>

    <link
        rel="stylesheet"
        href="dots.css"
    >

</head>

<body>

<div
    class="sakura-layer"
    id="sakuraLayer"
></div>


<main class="game-page">


    <header class="game-header">

        <a
            href="games.html"
            class="back-btn"
        >
            ←
        </a>


        <div class="brand">

            <div class="brand-icon">
                ✦
            </div>

            <div>

                <h1>
                    Dots & Boxes
                </h1>

                <p>
                    DRAW OUR LITTLE BOXES
                </p>

            </div>

        </div>


        <div
            class="connection-status"
            id="connectionStatus"
        >

            <span></span>

            <small>
                Connecting
            </small>

        </div>

    </header>


    <section class="players">

        <div
            class="player-card active"
            id="youPlayer"
        >

            <div class="avatar">
                🌸
            </div>

            <div>

                <span>
                    YOU
                </span>

                <strong id="youName">
                    You
                </strong>

            </div>

            <strong
                class="score"
                id="yourScore"
            >
                0
            </strong>

        </div>


        <div class="versus">
            VS
        </div>


        <div
            class="player-card"
            id="partnerPlayer"
        >

            <div class="avatar">
                🌷
            </div>

            <div>

                <span>
                    PARTNER
                </span>

                <strong id="partnerName">
                    Waiting...
                </strong>

            </div>

            <strong
                class="score"
                id="partnerScore"
            >
                0
            </strong>

        </div>

    </section>


    <section class="status-card">

        <span>
            GAME STATUS
        </span>

        <strong id="gameStatus">
            Waiting for partner...
        </strong>

    </section>


    <div class="turn-pill">

        <i></i>

        <span id="turnText">
            Waiting for partner
        </span>

    </div>


    <section
        class="dots-board"
        id="dotsBoard"
    >

        <!-- Grid generated by JS -->

    </section>


    <section class="score-summary">

        <div>
            <span>YOU</span>
            <strong id="youBoxes">0</strong>
        </div>

        <div class="heart">
            ♡
        </div>

        <div>
            <span>PARTNER</span>
            <strong id="partnerBoxes">0</strong>
        </div>

    </section>


    <section class="controls">

        <button id="newGameButton">
            🌸 New Game
        </button>

        <button id="leaveButton">
            Leave Game
        </button>

    </section>


    <div
        class="result-overlay hidden"
        id="resultOverlay"
    >

        <div class="result-card">

            <div id="resultIcon">
                ✦
            </div>

            <span>
                GAME COMPLETE
            </span>

            <h2 id="resultTitle">
                You Win!
            </h2>

            <p id="resultMessage">
                The boxes are yours ✨
            </p>

            <button id="resultNewGame">
                Play Again
            </button>

        </div>

    </div>


</main>


<script src="/socket.io/socket.io.js"></script>

<script src="dots.js"></script>

</body>
</html>
