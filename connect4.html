<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff7fa">

    <title>USSPACE • Connect 4</title>

    <link rel="stylesheet" href="connect4.css">
</head>

<body>

<div class="sakura-layer" id="sakuraLayer"></div>

<main class="game-page">

    <header class="game-header">

        <a href="games.html" class="back-btn">←</a>

        <div class="brand">
            <div class="brand-icon">🌸</div>

            <div>
                <h1>Connect 4</h1>
                <p>OUR LITTLE GAME</p>
            </div>
        </div>

        <div class="connection-status" id="connectionStatus">
            <span></span>
            <small>Connecting</small>
        </div>

    </header>


    <section class="players">

        <div class="player-card active" id="youPlayer">

            <div class="avatar">🌸</div>

            <div>
                <span>YOU</span>
                <strong id="youName">You</strong>
            </div>

            <b class="player-piece you-piece"></b>

        </div>


        <div class="versus">VS</div>


        <div class="player-card" id="partnerPlayer">

            <div class="avatar">🌷</div>

            <div>
                <span>PARTNER</span>
                <strong id="partnerName">Waiting...</strong>
            </div>

            <b class="player-piece partner-piece"></b>

        </div>

    </section>


    <section class="status-card">

        <span>GAME STATUS</span>

        <strong id="gameStatus">
            Waiting for partner...
        </strong>

    </section>


    <div class="turn-pill">

        <i></i>

        <span id="turnText">
            Waiting for partner
        </span>

    </div>


    <section class="connect-board" id="gameBoard">

        <!-- 42 cells generated by JS -->

    </section>


    <section class="score-card">

        <div>
            <span>YOU</span>
            <strong id="yourScore">0</strong>
        </div>

        <i>✿</i>

        <div>
            <span>DRAWS</span>
            <strong id="drawScore">0</strong>
        </div>

        <i>✿</i>

        <div>
            <span>PARTNER</span>
            <strong id="partnerScore">0</strong>
        </div>

    </section>


    <section class="controls">

        <button id="newGameButton">
            🌸 New Game
        </button>

        <button id="leaveButton">
            Leave Game
        </button>

    </section>


    <div class="result-overlay hidden" id="resultOverlay">

        <div class="result-card">

            <div id="resultIcon">🌸</div>

            <span>ROUND COMPLETE</span>

            <h2 id="resultTitle">You Win!</h2>

            <p id="resultMessage">
                Beautiful move ✨
            </p>

            <button id="resultNewGame">
                Play Again
            </button>

        </div>

    </div>

</main>

<script src="/socket.io/socket.io.js"></script>
<script src="connect4.js"></script>

</body>
</html>
