<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#fff7fa"
    >

    <title>USSPACE • Emoji Guess</title>

    <link rel="stylesheet" href="emoji.css">

</head>

<body>

<div class="sakura-layer" id="sakuraLayer"></div>


<main class="game-page">


    <header class="game-header">

        <a href="games.html" class="back-btn">
            ←
        </a>


        <div class="brand">

            <div class="brand-icon">
                😊
            </div>

            <div>

                <h1>Emoji Guess</h1>

                <p>
                    GUESS THE MEANING
                </p>

            </div>

        </div>


        <div
            class="connection-status"
            id="connectionStatus"
        >

            <span></span>

            <small>
                Connecting
            </small>

        </div>

    </header>


    <section class="players">

        <div
            class="player-card active"
            id="youPlayer"
        >

            <div class="avatar">
                🌸
            </div>

            <div class="player-info">

                <span>
                    YOU
                </span>

                <strong id="youName">
                    You
                </strong>

            </div>

            <strong
                class="score"
                id="yourScore"
            >
                0
            </strong>

        </div>


        <div class="versus">
            VS
        </div>


        <div
            class="player-card"
            id="partnerPlayer"
        >

            <div class="avatar">
                🌷
            </div>

            <div class="player-info">

                <span>
                    PARTNER
                </span>

                <strong id="partnerName">
                    Waiting...
                </strong>

            </div>

            <strong
                class="score"
                id="partnerScore"
            >
                0
            </strong>

        </div>

    </section>


    <section class="status-card">

        <span>
            GAME STATUS
        </span>

        <strong id="gameStatus">
            Waiting for partner...
        </strong>

    </section>


    <section class="emoji-card">

        <div class="emoji-label">
            WHAT DOES THIS MEAN?
        </div>


        <div
            class="emoji-display"
            id="emojiDisplay"
        >
            🌸 ❓
        </div>


        <div
            class="emoji-hint"
            id="emojiHint"
        >
            Waiting for the next challenge...
        </div>


        <div
            class="emoji-answers"
            id="emojiAnswers"
        >

            <!-- Answers generated by JS -->

        </div>


        <div
            class="answer-message"
            id="answerMessage"
        ></div>

    </section>


    <section class="round-info">

        <div>
            <span>ROUND</span>

            <strong id="roundNumber">
                1 / 10
            </strong>
        </div>


        <div>
            <span>YOU</span>

            <strong id="emojiYourScore">
                0
            </strong>
        </div>


        <div>
            <span>PARTNER</span>

            <strong id="emojiPartnerScore">
                0
            </strong>
        </div>

    </section>


    <section class="controls">

        <button id="newGameButton">
            🌸 New Game
        </button>

        <button id="leaveButton">
            Leave Game
        </button>

    </section>


    <div
        class="result-overlay hidden"
        id="resultOverlay"
    >

        <div class="result-card">

            <div id="resultIcon">
                😊
            </div>

            <span>
                GAME COMPLETE
            </span>

            <h2 id="resultTitle">
                Amazing!
            </h2>

            <p id="resultMessage">
                You two are pretty good at this ✨
            </p>

            <button id="resultNewGame">
                Play Again
            </button>

        </div>

    </div>


</main>


<script src="/socket.io/socket.io.js"></script>

<script src="emoji.js"></script>

</body>
</html>
