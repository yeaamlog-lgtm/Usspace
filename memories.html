<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#fff1f6"
    >

    <title>USSPACE • Memories</title>

    <link
        rel="stylesheet"
        href="memories.css"
    >
</head>

<body>

    <!-- Sakura -->
    <div
        class="sakura-container"
        id="sakuraContainer"
    ></div>

    <div class="bg-glow glow-one"></div>
    <div class="bg-glow glow-two"></div>


    <main class="memories-page">


        <!-- HEADER -->

        <header class="memories-header">

            <a
                href="home.html"
                class="back-button"
                aria-label="Back"
            >
                ←
            </a>


            <div class="brand">

                <div class="brand-icon">
                    🌸
                </div>

                <div>

                    <strong>
                        US<span>SPACE</span>
                    </strong>

                    <small>
                        OUR LITTLE MEMORIES
                    </small>

                </div>

            </div>


            <div class="memory-count">

                <span id="memoryCount">
                    0
                </span>

                <small>
                    memories
                </small>

            </div>

        </header>


        <!-- HERO -->

        <section class="memories-hero">

            <div class="hero-flower">
                🌸
            </div>

            <p class="eyebrow">
                MOMENTS WE KEEP
            </p>

            <h1>
                Our
                <span>Memories</span>
            </h1>

            <p>
                Every little moment,
                kept right here. 💕
            </p>

        </section>


        <!-- UPLOAD -->

        <section class="upload-section">

            <button
                class="upload-button"
                id="uploadButton"
                type="button"
            >
                <span class="upload-icon">
                    ＋
                </span>

                Add Memory
            </button>


            <input
                type="file"
                id="memoryUpload"
                accept="image/*"
                multiple
                hidden
            >

        </section>


        <!-- GALLERY -->

        <section class="gallery-section">

            <div class="section-heading">

                <div>

                    <p>
                        OUR GALLERY
                    </p>

                    <h2>
                        Little Moments
                    </h2>

                </div>


                <button
                    class="clear-button"
                    id="clearMemories"
                    type="button"
                >
                    Clear All
                </button>

            </div>


            <!-- EMPTY -->

            <div
                class="empty-gallery"
                id="emptyGallery"
            >

                <div class="empty-icon">
                    📸
                </div>

                <h3>
                    No memories yet
                </h3>

                <p>
                    Add a photo and start
                    creating your little album.
                </p>

                <button
                    id="emptyUploadButton"
                    type="button"
                >
                    🌸 Add First Memory
                </button>

            </div>


            <!-- MEMORY GRID -->

            <div
                class="memory-grid"
                id="memoryGrid"
            ></div>

        </section>


        <!-- IMAGE VIEWER -->

        <div
            class="image-viewer"
            id="imageViewer"
            aria-hidden="true"
        >

            <div
                class="viewer-backdrop"
                id="viewerBackdrop"
            ></div>


            <div class="viewer-content">

                <button
                    class="viewer-close"
                    id="viewerClose"
                    type="button"
                    aria-label="Close"
                >
                    ×
                </button>


                <img
                    id="viewerImage"
                    alt="Memory"
                >


                <div class="viewer-info">

                    <span id="viewerDate">
                        Memory
                    </span>

                </div>


                <div class="viewer-actions">

                    <!-- PHOTO DOWNLOAD -->

                    <button
                        class="download-button"
                        id="viewerDownload"
                        type="button"
                    >
                        ↓ Download Photo
                    </button>


                    <button
                        class="viewer-delete"
                        id="viewerDelete"
                        type="button"
                        aria-label="Delete memory"
                    >
                        🗑️
                    </button>

                </div>

            </div>

        </div>


        <!-- FOOTER -->

        <footer class="memories-footer">

            <span>🌸</span>

            <p>
                Some moments deserve
                <strong>forever</strong>.
            </p>

            <span>🌸</span>

        </footer>

    </main>


    <script src="memories.js"></script>

</body>
</html>
